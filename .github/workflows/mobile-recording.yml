name: Mobile recording regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-recording-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-media-qa.txt
      - run: python -m pip install -r scripts/requirements-media-qa.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Existing practice tests and real AAC/fragmented MP4 API regression
        run: python -m pytest backend/tests/api/test_practice.py -q

  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: macos-15-intel
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build --prefix frontend
      - name: Shared mobile scenarios with native browser encoding and playback
        run: node scripts/run_mobile_qa.cjs ${{ matrix.browser }}
      - uses: actions/setup-python@v5
        if: matrix.browser == 'webkit'
        with:
          python-version: '3.12'
      - if: matrix.browser == 'webkit'
        run: |
          python -m pip install -r scripts/requirements-media-qa.txt
          command -v ffmpeg || brew install ffmpeg
      - name: Feed the same native WebKit bytes through real backend storage, streaming and decode
        if: matrix.browser == 'webkit'
        env:
          ECHOIC_QA_CAPTURE_DIR: ${{ github.workspace }}/.runtime/qa/webkit
        run: python -m pytest backend/tests/api/test_practice.py -m media -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-recording-${{ matrix.browser }}
          path: .runtime/qa/${{ matrix.browser }}/
          include-hidden-files: true
          retention-days: 7
